rapeseed:
  VIs: {"NDVI":[6, 2], "NDYI":[1, 0], 'CRI':[1, 0], 'CFI3':[2, 1, 0]} # vegetation indices and the band numbers to use and formula is in the script src/data/data_loader_rise.py
  ts_slice_width: 1
  ts_composite_mode: "max"
  algorithm: "KMeans"
  cluster_assign: "highest"
  class_assign: "mode" # mode, single
  band_name_map:
    S2-L2A-B02 : S2-L2A-B02
    S2-L2A-B03 : S2-L2A-B03
    S2-L2A-B04 : S2-L2A-B04
    S2-L2A-B05 : S2-L2A-B05
    S2-L2A-B06 : S2-L2A-B06
    S2-L2A-B07 : S2-L2A-B07
    S2-L2A-B08 : S2-L2A-B08
    S2-L2A-B11 : S2-L2A-B11
    S2-L2A-B12 : S2-L2A-B12
    S1-SIGMA0-VH : S1-SIGMA0-VH
    S1-SIGMA0-VV : S1-SIGMA0-VV